services:
  linktree:
    build: .
    container_name: linktree
    ports:
      - "3001:8080"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - PORT=8080
      - DATA_DIR=/app/data
      - MAX_FILE_SIZE=209715200
      - TZ=Asia/Shanghai
    restart: unless-stopped
