<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <meta name="author" content="啊芃">
  <meta name="theme-color" content="#10b981">
  <link rel="canonical" href="{{CANONICAL}}">

  <!-- Open Graph（微信 / QQ / 脉脉 / 掘金 等抓取用；服务端按路由注入真实内容） -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="啊芃">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:url" content="{{CANONICAL}}">
  <meta property="og:image" content="{{OG_IMAGE}}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{TITLE}}">
  <meta name="twitter:description" content="{{DESCRIPTION}}">
  <meta name="twitter:image" content="{{OG_IMAGE}}">

  <!-- 字体自托管（Geist / SIL OFL 1.1），不再依赖 fonts.googleapis.com -->
  <link rel="preload" href="/static/fonts/gyByhwUxId8gMEwcGFU.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/fonts/or3nQ6H-1_WfwkMZI_qYFrcdmg.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/fonts.css">
  <link rel="icon" type="image/jpeg" href="/static/avatar.jpg">
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
