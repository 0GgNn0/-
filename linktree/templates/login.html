<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理登录 - LinkTree</title>
  <link rel="icon" type="image/jpeg" href="/static/avatar.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body data-theme="light">

  <div class="login-split">
    <div class="login-brand-side">
      <img class="login-brand-logo" src="/static/avatar.jpg" alt="Avatar">
      <div class="login-brand-name">LinkTree</div>
      <p class="login-brand-desc">你的个人链接聚合站，一站式管理链接、作品、文件与 AI 对话。</p>
    </div>

    <div class="login-form-side">
      <div class="login-form">
        <h1 class="login-form-title">欢迎回来</h1>
        <p class="login-form-sub">请输入管理密码以继续</p>
        <form id="loginForm">
          <div class="login-field">
            <label for="password">密码</label>
            <input type="password" id="password" class="login-input" placeholder="管理密码" autofocus required>
          </div>
          <button type="submit" class="login-submit">登 录</button>
        </form>
        <p class="error-msg" id="errorMsg"></p>
        <a href="/" class="login-back">返回首页</a>
      </div>
    </div>
  </div>

  <button class="theme-toggle" id="themeToggle" title="切换主题" aria-label="切换暗色/亮色模式">
    <span class="theme-icon" id="themeIcon">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    </span>
  </button>

  <script>
    (function() {
      // 主题
      var html = document.documentElement;
      var toggle = document.getElementById('themeToggle');
      var iconMoon = document.querySelector('.icon-moon');
      var iconSun = document.querySelector('.icon-sun');
      var stored = localStorage.getItem('linktree-theme') || 'light';

      function applyTheme(t) {
        html.setAttribute('data-theme', t);
        if (t === 'dark') {
          iconMoon.style.display = 'none';
          iconSun.style.display = 'block';
        } else {
          iconMoon.style.display = 'block';
          iconSun.style.display = 'none';
        }
        localStorage.setItem('linktree-theme', t);
      }
      applyTheme(stored);
      toggle.addEventListener('click', function() {
        var current = html.getAttribute('data-theme');
        applyTheme(current === 'dark' ? 'light' : 'dark');
      });

      // 登录
      var form = document.getElementById('loginForm');
      var error = document.getElementById('errorMsg');
      form.addEventListener('submit', function(e) {
        e.preventDefault();
        var password = document.getElementById('password').value;
        error.classList.remove('show');

        fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: password })
        })
        .then(function(r) { return r.json(); })
        .then(function(data) {
          if (data.ok) {
            window.location.href = '/admin';
          } else {
            error.textContent = data.message || '登录失败';
            error.classList.add('show');
          }
        })
        .catch(function() {
          error.textContent = '网络错误，请重试';
          error.classList.add('show');
        });
      });
    })();
  </script>
</body>
</html>
