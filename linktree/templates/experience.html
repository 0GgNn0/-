<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>经历 - {{.DisplayName}}</title>
  <link rel="icon" type="image/jpeg" href="/static/avatar.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css">
  <style>
    .pg-wrap { min-height: 100dvh; position: relative; z-index: 1; max-width: 680px; margin: 0 auto; padding: 28px 24px 60px; }
    .pg-back { font-size: 13px; color: var(--text-secondary); text-decoration: none; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--border); background: rgba(255,255,255,0.6); backdrop-filter: blur(10px); display: inline-block; transition: var(--transition); }
    [data-theme="dark"] .pg-back { background: rgba(24,24,27,0.6); }
    .pg-back:hover { color: var(--accent); border-color: var(--accent); transform: translateY(-1px); }
    .pg-card { margin-top: 20px; border: 1px solid var(--border); border-radius: var(--radius); background: rgba(255,255,255,0.88); backdrop-filter: blur(10px); padding: 36px; }
    [data-theme="dark"] .pg-card { background: rgba(24,24,27,0.88); }
    .pg-kicker { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); margin-bottom: 10px; }
    .pg-h1 { font-size: clamp(32px, 5vw, 44px); font-weight: 800; color: var(--text); letter-spacing: -0.03em; line-height: 1.05; }
    .tl { margin-top: 28px; position: relative; padding-left: 22px; }
    .tl::before { content: ''; position: absolute; left: 5px; top: 6px; bottom: 6px; width: 1px; background: linear-gradient(var(--accent), var(--border)); }
    .tl-item { position: relative; padding-bottom: 30px; }
    .tl-item:last-child { padding-bottom: 0; }
    .tl-dot { position: absolute; left: -22px; top: 5px; width: 11px; height: 11px; border-radius: 50%; background: var(--accent); border: 2px solid var(--bg); box-shadow: 0 0 0 3px var(--accent-muted); }
    .tl-period { font-size: 12px; color: var(--accent); font-family: 'Geist Mono', monospace; letter-spacing: 0.06em; font-variant-numeric: tabular-nums; }
    .tl-title { font-size: 17px; font-weight: 700; color: var(--text); margin-top: 5px; letter-spacing: -0.01em; }
    .tl-desc { font-size: 14px; color: var(--text-secondary); line-height: 1.7; margin-top: 5px; text-wrap: pretty; }
  </style>
</head>
<body data-theme="{{.Theme}}">
  <button class="theme-toggle" id="themeToggle" title="切换主题" aria-label="切换暗色/亮色模式"><span class="theme-icon" id="themeIcon"><svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg><svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></span></button>

  <div class="pg-wrap">
    <a href="/" class="pg-back reveal" style="--d:0s">← 返回首页</a>
    <div class="pg-card reveal" style="--d:.1s">
      <div class="pg-kicker">Experience</div>
      <h1 class="pg-h1">经历</h1>
      <div class="tl">
        {{range $i, $e := .Experiences}}
        <div class="tl-item reveal" style="--d:{{mul $i 0.1}}s">
          <div class="tl-dot"></div>
          <div class="tl-period">{{$e.Period}}</div>
          <div class="tl-title">{{$e.Title}}</div>
          {{if $e.Description}}<div class="tl-desc">{{$e.Description}}</div>{{end}}
        </div>
        {{end}}
      </div>
    </div>
  </div>

  <script>(function(){var h=document.documentElement,i=document.getElementById('themeIcon'),s=localStorage.getItem('linktree-theme')||'auto';function e(){return s==='auto'?(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):s}function a(t){h.setAttribute('data-theme',t);document.body.setAttribute('data-theme',t);if(t==='dark')i.classList.add('is-dark');else i.classList.remove('is-dark');localStorage.setItem('linktree-theme',t)}a(e());document.getElementById('themeToggle').addEventListener('click',function(){a(h.getAttribute('data-theme')==='dark'?'light':'dark')})})();</script>
</body>
</html>
